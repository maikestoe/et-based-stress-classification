[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "et-stress-classification"
version = "0.1.0"
description = "Stress classification from eye-tracking time series"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Maike Laut"}
]
dependencies = [
    "h5py==3.11.0",
    "imbalanced-learn==0.12.2",
    "joblib==1.3.2",
    "numpy>=1.26,<3",
    "optuna==3.6.1",
    "optuna-integration==3.6.0",
    "pandas>=2.2",
    "plotly==5.20.0",
    "psutil==5.9.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "seaborn==0.13.2",
    "tabulate==0.9.0",
    "matplotlib==3.9.0",
    "fau-colors==1.7.0",
    "PyWavelets==1.6.0",
    "openpyxl>=3.1.5",
    "kaleido==0.2.1",
    "memory-profiler>=0.61.0",
]

[project.optional-dependencies]
tensorflow = [
    "tensorflow==2.18.0",
]

[tool.setuptools]
py-modules = [
    "Classes",
    "IPA_utils",
    "fix_utils",
    "pd_utils",
    "utils",
    "pickle_compat",
    "DL_models",
    "DL_utils",
    "DL_train_CV",
    "DL_CV",
    "process_vr_goalkeeper",
    "segment_vr_goalkeeper",
    "process_fordigitstress",
    "segment_fordigitstress",
]

[tool.setuptools.package-dir]
"" = "src"
